name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and check the UI
        working-directory: web
        run: npm ci && npm run build && npm run check

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go vet (live importer check)
        run: go vet -tags live ./internal/importer

      # Fails if the committed golden file differs from what parse.js produces.
      - name: Parser golden drift check
        run: |
          node scripts/parser-golden/gen.mjs > internal/recipes/testdata/parse_golden.json
          git diff --exit-code -- internal/recipes/testdata/parse_golden.json

      - name: Test
        env:
          SOUS_REQUIRE_UI: "1"
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # The coverage floor: total Go statement coverage below it fails the
      # build. Raise it as coverage grows; never lower it to make a PR pass.
      # Gated on one OS so platform-specific code paths can't make the
      # number differ between runners.
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_FLOOR: "85.0"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Go coverage: ${total}% (floor ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t < f) }'; then
            echo "::error::coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          fi
          echo "coverage ${total}% meets the floor of ${COVERAGE_FLOOR}%"

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/sous
