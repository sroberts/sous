# Nightly: the checks too slow or too noisy for every PR.
#   coverage  the full suite with coverage, against the same floor as CI
#   security  known vulnerabilities in Go modules and the UI's npm packages
#   live      the importer against the 25 real recipe sites (report only)
name: nightly

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Full coverage suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI
        working-directory: web
        run: npm ci && npm run build
      - name: Test with coverage
        env:
          SOUS_REQUIRE_UI: "1"
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage floor
        env:
          COVERAGE_FLOOR: "85.0"
        run: |
          {
            echo "### Coverage by function (lowest 20)"
            echo '```'
            go tool cover -func=coverage.out | grep -v '^total:' | sort -k3 -n | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Go coverage: ${total}% (floor ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t < f) }'; then
            echo "::error::coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: coverage.out
          retention-days: 30

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: npm audit (shipped dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  live:
    name: Live importer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Sites change and block crawlers, so this reports drift rather than
      # failing the night. Read the log when an import regresses.
      - name: Fetch the 25 test links
        continue-on-error: true
        run: go test -tags live -run Live -v -count=1 ./internal/importer 2>&1 | tee live.log
      - uses: actions/upload-artifact@v4
        with:
          name: live-import-report
          path: live.log
          retention-days: 30
