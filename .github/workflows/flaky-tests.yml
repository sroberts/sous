# Weekly flaky-test analysis: run the suite several times and find tests
# that both pass and fail on the same code. A new flake fails this run;
# known flakes are listed in flaky-tests.json with an issue to fix them.
name: flaky-tests

on:
  schedule:
    - cron: "41 6 * * 1" # Mondays, 06:41 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: Times to run the suite
        default: "5"

permissions:
  contents: read

jobs:
  flaky:
    name: Rerun the suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build the UI
        working-directory: web
        run: npm ci && npm run build
      - name: Run the suite repeatedly
        env:
          SOUS_REQUIRE_UI: "1"
          # Through env, not ${{ }} in run: the input is free text, and
          # interpolating it would let it run as shell.
          RUNS: ${{ inputs.runs || '5' }}
        # Failures are expected here; the analysis step decides the result.
        run: |
          case "$RUNS" in
            ''|*[!0-9]*) echo "::error::runs must be a whole number, not '$RUNS'"; exit 1 ;;
          esac
          go test -race -count="$RUNS" -json ./... > test-runs.jsonl || true
      - name: Find flaky tests
        run: uv run --no-project scripts/flaky/flaky.py test-runs.jsonl --known flaky-tests.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-test-runs
          path: test-runs.jsonl
          retention-days: 14
