<article class="h-recipe">
  <h1 class="p-name">Weeknight Dal.</h1>
  <img class="u-photo" src="https://example.com/dal.jpg" alt="">
  <p class="p-summary">Red lentils, fast.</p>
  <div class="p-author h-card"><span class="p-name">Someone Else</span></div>
  <p>Serves <span class="p-yield">4</span>. Takes <time class="dt-duration" datetime="PT40M">40 minutes</time>.</p>
  <ul>
    <li class="p-ingredient">1 cup red lentils</li>
    <li class="p-ingredient">&frac12; tsp turmeric</li>
    <li class="p-ingredient">2 cloves garlic</li>
  </ul>
  <div class="e-instructions">
    <ol>
      <li>Rinse the lentils.</li>
      <li>Simmer with the turmeric for 20 minutes.</li>
    </ol>
    <p>Fry the garlic and stir it in.<br>Season to taste.</p>
  </div>
  <ul><li class="p-nutrition">250 calories</li><li class="p-nutrition">14 g protein</li></ul>
</article>
